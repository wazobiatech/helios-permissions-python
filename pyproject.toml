[tool.poetry]
name = "wazobiatech-helios-permissions"
version = "0.6.0"
description = "Python SDK for the Nexus permission contract — Redis-cached callerHasPermission for cross-service authz. Role-permissions are codegen'd from wazobiatech/permission-contract."
authors = ["Wazobia Tech <dev@wazobiatech.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "helios_permissions", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
fakeredis = "^2.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
codegen = "scripts.codegen_permissions:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
